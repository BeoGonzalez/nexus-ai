    "crewai[litellm]>=1.15.20",
    "deepagents>=0.7.13",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "groq>=0.37.1",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.3",
    "langchain>=1.4.0",
    "langchain-chroma>=1.0.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langsmith>=0.12.2",
    "lxml>=6.1.3",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "openai>=2.54.0",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pydantic>=2.12.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.0.1",
    "slowapi>=0.1.10",
    "streamlit>=1.63.0",
    "tiktoken>=0.12.0",
    "uvicorn[standard]>=0.52.4",
    "wikipedia>=1.4.0",
